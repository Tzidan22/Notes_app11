name: flutter_notes_app
description: "A simple, modern offline notes app built with Flutter and Hive."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local Hive storage for notes.
  # State management.
  provider: ^6.1.2
  shared_preferences: ^2.3.3

  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true


flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"


  flutter:
  uses-material-design: true

  assets:
    - assets/icon.png