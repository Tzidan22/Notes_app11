name: flutter_notes_app
description: "A simple, modern offline notes app built with Flutter and SQLite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local persistent storage for notes.
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.5
  path: ^1.9.0

  # State management.
  provider: ^6.1.2

  # Persists the user's theme mode / accent color choice across restarts.
  shared_preferences: ^2.3.3
  flutter_quill: 11.5.1
  markdown_quill: 4.3.0
  markdown: 7.3.0
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true


flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"


  flutter:
  uses-material-design: true

  assets:
    - assets/icon.png